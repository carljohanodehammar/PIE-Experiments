function RichContent({ text }) {
  if (!text.contentRich) {
    return (
      <div className={`excerpt ${text.panelStyle}`} style={{ whiteSpace: "pre-line" }}>
        {text.content}
      </div>
    );
  }
  const parts = text.contentTemplate.split(/\{(\d+)\}/);
  const nodes = parts.map((part, i) => {
    const num = parseInt(part);
    if (!isNaN(num) && text.terms[num]) {
      const t = text.terms[num];
      return (
        <span key={i} style={{ position: "relative", display: "inline" }}>
          <span className="term" title={t.def} style={{ borderBottom: "2px dashed var(--ju-yellow)", cursor: "help" }}>{t.word}</span>
        </span>
      );
    }
    const isRef = part.match(/\[doi:[^\]]+\]/);
    if (isRef) {
      return <span key={i} style={{ color: "var(--ju-purple)", fontSize: "0.8em" }}>{part}</span>;
    }
    return <span key={i}>{part}</span>;
  });
  return (
    <div className={`excerpt ${text.panelStyle}`}>
      {nodes}
      <div style={{ marginTop: "0.6rem", fontSize: "0.7rem", color: "var(--ju-purple-dark)", fontStyle: "italic", fontFamily: "var(--font-body)" }}>
        Hover over underlined terms for definitions.
      </div>
    </div>
  );
}

function TextPanel({ text, side }) {
  const [open, setOpen] = useState(false);
  return (
    <div className={`text-panel selected-${side} fade-in`}>
      <div className="panel-header">
        <span className={`panel-badge ${text.badgeClass}`}>{text.badge}</span>
        <div className="panel-title-block">
          <div className="panel-title">{text.title}</div>
          <div className="panel-meta">{text.meta}</div>
        </div>
        <span className="cefr-pip">{text.cefr}</span>
      </div>
      <div className="panel-body">
        <RichContent text={text} />
        <button className={`annotation-toggle ${open ? "open" : ""}`} onClick={() => setOpen(!open)}>
          {open ? "▲ Hide" : "▼ Show"} reading strategies and annotation
        </button>
        {open && (
          <div className="annotation-box fade-in">
            <h4>Reading strategies: {text.annotations.title}</h4>
            <ul className="annotation-list">
              {text.annotations.points.map((pt, i) => (
                <li key={i}><span className="bullet">→</span><span>{pt}</span></li>
              ))}
            </ul>
            <div className="strategy-chips">
              {text.annotations.strategies.map((s) => (
                <span key={s} className="strategy-chip">{s}</span>
              ))}
            </div>
          </div>
        )}
        <div className="feature-row">
          {Object.entries(text.features).map(([k, v]) => (
            <span key={k} className="feature-item">
              <strong>{k}:</strong> {v}
            </span>
          ))}
        </div>
      </div>
    </div>
  );
}

            <div>
              <h3 style={{ color: "var(--ju-purple)" }}>Four complexity levels</h3>
              <p>Informal (A2–B1), semi-formal (B1–B2), formal (B2–C1), and academic C1+. Academic texts have underlined terms: hover for definitions. The same topic appears in all four levels.</p>
            </div>
          </div>
          <div className="intro-card">
            <div className="intro-icon" style={{ background: "var(--ju-yellow-light)" }}>💡</div>
            <div>
              <h3 style={{ color: "#7a5700" }}>Your C1 target</h3>
              <p>At C1, you read academic texts using active strategies, manage unfamiliar terminology without stopping, and identify how argument structure and evidence work across different genres.</p>
            </div>
          </div>
        </div>

        <div className="section-label">Choose a topic</div>
        <div className="topic-tabs">
          {TOPICS.map((t) => (
            <button key={t.id} className={`topic-tab ${topic === t.id ? "active" : ""}`}
              onClick={() => { setTopic(t.id); setLeftIdx(0); setRightIdx(3); }}>
              {t.label}
            </button>
          ))}
        </div>

        <div className="spectrum-bar">
          <div>
            <div className="spectrum-label left">Informal</div>
            <div style={{ fontSize: "0.63rem", color: "var(--grey-400)", marginTop: "0.1rem" }}>A2–B1</div>
          </div>
          <div className="spectrum-track">
            <div className="spectrum-dots">
              {texts.map((t, i) => (
                <div key={t.id}
                  className={`spectrum-dot ${leftIdx === i || rightIdx === i ? "active" : ""}`}
                  style={{
                    borderColor: leftIdx === i ? "var(--ju-turquoise)" : rightIdx === i ? "var(--ju-purple)" : "var(--grey-400)",
                    background: leftIdx === i ? "var(--ju-turquoise)" : rightIdx === i ? "var(--ju-purple)" : "white",
                  }}
                  title={t.title}
                  onClick={() => { if (i !== rightIdx) setLeftIdx(i); else if (i !== leftIdx) setRightIdx(i); }}
                />
              ))}
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div className="spectrum-label right">Academic C1</div>
            <div style={{ fontSize: "0.63rem", color: "var(--grey-400)", marginTop: "0.1rem" }}>C1+</div>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1.5rem", marginBottom: "1.2rem" }}>
          {["Left panel", "Right panel"].map((label, panelSide) => {
            const current = panelSide === 0 ? leftIdx : rightIdx;
            const setter = panelSide === 0 ? setLeftIdx : setRightIdx;
            const colour = panelSide === 0 ? "var(--ju-turquoise)" : "var(--ju-purple)";
            return (
              <div key={label}>
                <div className="section-label" style={{ color: colour }}>{label}</div>
                <div style={{ display: "flex", gap: "0.4rem", flexWrap: "wrap" }}>
                  {texts.map((t, i) => (
                    <button key={t.id} onClick={() => setter(i)}
                      style={{
                        background: current === i ? colour : "none",
                        border: `1.5px solid ${current === i ? colour : "var(--grey-200)"}`,
                        color: current === i ? "white" : "var(--grey-700)",
                        borderRadius: "6px", padding: "0.28rem 0.6rem", fontSize: "0.73rem",
                        cursor: "pointer", fontFamily: "var(--font-body)", fontWeight: 500, transition: "all 0.15s",
                      }}>
                      {t.badge}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        <div className="panels-grid">
          <TextPanel text={texts[leftIdx]} side="left" key={`left-${topic}-${leftIdx}`} />
          <TextPanel text={texts[rightIdx]} side="right" key={`right-${topic}-${rightIdx}`} />
        </div>

        <div className="compare-section">
          <h2 onClick={() => setShowCompare(!showCompare)}>
            {showCompare ? "▲" : "▼"} Compare text features across all levels
          </h2>
          {showCompare && (
            <table className="feature-table fade-in">
              <thead>
                <tr>
                  <th>Feature</th>
                  <th>Informal (A2–B1)</th>
                  <th>Formal (B2)</th>
                  <th>Academic (C1+)</th>
                </tr>
              </thead>
              <tbody>
                {COMPARE_FEATURES.map((row) => (
                  <tr key={row.feature}>
                    <td>{row.feature}</td>
                    <td className="informal-cell">{row.informal}</td>
                    <td className="formal-cell">{row.formal}</td>
                    <td className="academic-cell">{row.academic}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>

        <div className="glossary-section">
          <h2 onClick={() => setShowStrategies(!showStrategies)}>
            {showStrategies ? "▲" : "▼"} Reading strategies reference
          </h2>
          {showStrategies && (
            <div className="glossary-grid fade-in">
              {STRATEGIES.map((s) => (
                <div className="glossary-card" key={s.name}>
                  <h4>{s.icon} {s.name}</h4>
                  <p>{s.desc}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      </main>

      <footer style={{ borderTop: "1px solid var(--grey-200)", padding: "1.1rem 2rem", display: "flex", alignItems: "center", justifyContent: "space-between", maxWidth: "1200px", margin: "0 auto" }}>
        <div style={{ fontSize: "0.7rem", color: "var(--grey-400)" }}>
          Pathway Intensive English (PIEG13) · Jönköping University Enterprise · For educational use.
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
          <span style={{ fontSize: "0.68rem", color: "var(--grey-400)" }}>CEFR:</span>
          <div className="cefr-scale">
            {[["A1","#ccc"],["A2","#b5d5d4"],["B1","var(--ju-turquoise)"],["B2","#7a9e9d"],["C1","var(--ju-purple)"],["C2","var(--ju-purple-dark)"]].map(([l,bg]) => (
              <div key={l} className="cefr-step" style={{ background: bg }}>{l}</div>
            ))}
          </div>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
